services:
  teamsexam-admin:
    build:
      context: ./php
      dockerfile: Dockerfile
    container_name: teamsexam-admin
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ../admin:/app
      - ./php/custom.ini:/usr/local/etc/php/conf.d/custom.ini:ro
      - caddy_data:/data
      - caddy_config:/config
    working_dir: /app
    command: sh -c 'cron && exec frankenphp run --config Caddyfile'
    tty: true
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: teamsexam-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
  
  db:
    image: postgres:16
    container_name: teamsexam-db
    shm_size: 128mb
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_DB: teamsexam
      POSTGRES_PASSWORD: root
      POSTGRES_USER: teamsexam
    volumes:
      - ./pgdata:/var/lib/postgresql/data
  
  adminer:
    image: adminer:6
    container_name: teamsexam-adminer
    ports:
      - "8080:8080"
    depends_on:
      - db

  swagger-ui:
    image: swaggerapi/swagger-ui:v5.32.0
    container_name: teamsexam-swagger-ui
    profiles: [dev]
    environment:
      URL: /swagger/openapi.json
      VALIDATOR_URL: none
      PERSIST_AUTHORIZATION: "false"
    volumes:
      - type: bind
        source: ../admin/writable/openapi.json
        target: /usr/share/nginx/html/openapi.json
        read_only: true
        bind:
          create_host_path: false

volumes:
  caddy_data:
  caddy_config:
  redis_data:
    